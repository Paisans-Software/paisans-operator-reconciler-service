# Builds and publishes ghcr.io/paisans-software/operator-reconciler.
#
# Only a tag operator-reconciler-vX.Y.Z publishes, as X.Y.Z; a push to a
# branch, develop included, publishes nothing. Founder rule: an image is
# published when someone tags it, never as a side effect of a merge. The core
# catalog's foundation.yaml names the track the pocket-id blueprint runs, so a
# deployment moves to a new image only when the catalog's track admits it.
name: operator-reconciler image

on:
  push:
    tags: ["operator-reconciler-v*"]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/operatorreconciler/ ./internal/dnscontinuity/ ./internal/pocketid/ ./cmd/operator-reconciler/
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/paisans-software/operator-reconciler
          tags: |
            type=match,pattern=operator-reconciler-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/operator-reconciler/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
